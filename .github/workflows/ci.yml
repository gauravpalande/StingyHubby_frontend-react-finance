name: PennyWize CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-react-finance
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend-react-finance/.nvmrc
          cache: npm
          cache-dependency-path: frontend-react-finance/package-lock.json
      - name: Install locked dependencies
        # The tests and build work without dependency lifecycle scripts.
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Type-check and build application and email template
        run: npm run build
